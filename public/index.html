<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SnapDeploy — Static Hosting</title>
<meta name="description" content="SnapDeploy hosts static sites. Push to deploy.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b0d12;color:#e6e8ee;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
header{padding:24px 32px;border-bottom:1px solid #1c2030;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;letter-spacing:-.02em;font-size:18px}
.brand span{color:#4f8cff}
nav a{color:#8b93a7;text-decoration:none;font-size:14px;margin-left:24px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:680px;margin:0 auto;padding:80px 32px}
h1{font-size:40px;letter-spacing:-.03em;line-height:1.15;margin-bottom:16px}
h1 span{color:#4f8cff}
p{color:#8b93a7;margin-bottom:28px}
pre{background:#12151f;border:1px solid #1c2030;border-radius:10px;padding:16px 20px;font-size:13px;color:#c7cddd;overflow-x:auto}
pre b{color:#4f8cff;font-weight:400}
footer{padding:20px 32px;border-top:1px solid #1c2030;color:#5b6275;font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="brand">Snap<span>Deploy</span></div>
  <nav><a href="/health">Status</a></nav>
</header>
<main>
  <h1>Ship static sites in <span>one push</span>.</h1>
  <p>Edge-cached delivery, instant rollbacks, automatic HTTPS. No config required.</p>
  <pre><b>$</b> git push snapdeploy main
<i>✓ build complete in 4.2s</i>
<i>✓ deployed to https://snapdeploy.app</i></pre>
</main>
<footer>&copy; 2026 SnapDeploy. All rights reserved.</footer>
</body>
</html>
